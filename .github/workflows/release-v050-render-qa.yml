name: v0.5.0 Candidate Render QA
on:
  pull_request:
    branches: [release/v0.5.0]
  push:
    branches: [release/v0.5.0]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: release-v050-render-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render-qa:
    name: v0.5.0 Render QA (${{ matrix.id }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runner: ubuntu-24.04
          - id: win32-x64
            runner: windows-2022
          - id: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      OPENFILM_SOURCE_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Admit candidate-pinned FFmpeg and four licensed CJK fonts
        id: setup
        run: pnpm exec tsx scripts/ci/setup-render-qa.ts hosted-tools "$RUNNER_TEMP/openfilm-v050-tools"
      - name: Run candidate-version media regressions
        id: suite
        continue-on-error: true
        env:
          OPENFILM_RENDER_QA_OUTPUT: ${{ runner.temp }}/openfilm-v050-render-evidence
        run: >-
          pnpm test:render-qa:release
          --reporter=json
          --outputFile="$RUNNER_TEMP/openfilm-v050-vitest.json"
      - name: Write path-free exact-head evidence
        id: evidence
        if: always()
        env:
          OPENFILM_RENDER_QA_OUTPUT: ${{ runner.temp }}/openfilm-v050-render-evidence
        run: >-
          pnpm exec tsx scripts/ci/release-render-qa-v050.ts write
          "$RUNNER_TEMP/openfilm-v050-vitest.json"
          "$OPENFILM_RENDER_QA_OUTPUT/render.json"
          "$RUNNER_TEMP/openfilm-v050-reports/${{ matrix.id }}.json"
      - uses: actions/upload-artifact@v4
        id: upload
        if: always()
        with:
          name: render-qa-v050-${{ matrix.id }}-${{ env.OPENFILM_SOURCE_CANDIDATE }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openfilm-v050-reports/${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 90
      - name: Require setup, renderer, evidence and artifact steps
        if: always()
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          RENDER_OUTCOME: ${{ steps.suite.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          [[ "$SETUP_OUTCOME" == success ]]
          [[ "$RENDER_OUTCOME" == success ]]
          [[ "$EVIDENCE_OUTCOME" == success ]]
          [[ "$UPLOAD_OUTCOME" == success ]]
  render-qa-complete:
    name: v0.5.0 Render QA complete
    if: always()
    needs: [render-qa]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENFILM_SOURCE_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
      RENDER_QA_MATRIX_RESULT: ${{ needs.render-qa.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require every Render QA platform job to succeed
        if: always()
        run: test "$RENDER_QA_MATRIX_RESULT" = success
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: render-qa-v050-*-${{ env.OPENFILM_SOURCE_CANDIDATE }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openfilm-v050-reports
          merge-multiple: true
      - run: pnpm exec tsx scripts/ci/release-render-qa-v050.ts check "$RUNNER_TEMP/openfilm-v050-reports"
