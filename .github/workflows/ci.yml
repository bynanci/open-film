name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  OPENFILM_SOURCE_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast-contract-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify declared source head
        run: node scripts/ci/check-source-head.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:license
      - run: pnpm test:provenance
      - run: node --test scripts/ci/tests/source-head.node.mjs
      - run: node --test scripts/ci/tests/media-profile.node.mjs
      - run: python3 scripts/ci/tests/media-profile-process.py
      - run: pnpm format:check
      - run: pnpm test:i18n
      - run: pnpm test:docs-i18n
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:ci-partition
      - run: pnpm test:browser-partition
      - run: pnpm test:contracts
  heavy-media-qa:
    runs-on: ubuntu-24.04
    # Actual-media tests keep their existing budgets; browsers use isolated VMs below.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify declared source head
        run: node scripts/ci/check-source-head.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native media tools and independent timeline parser
        timeout-minutes: 8
        run: bash scripts/ci/install-media-tools.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ci-partition
      # Catch toolchain color-conversion mismatches before the full media run;
      # every case still runs again in the unchanged mandatory media suite.
      - name: Verify deterministic FFmpeg conversion
        run: pnpm exec vitest run packages/render/tests/export-profile.test.ts packages/render/tests/film-looks.test.ts --maxWorkers=1
      - run: pnpm test:media
        env:
          OPENFILM_GRAPHIC_QA_OUTPUT: ${{ runner.temp }}/graphic-scene-qa
          OPENFILM_AUDIO_EVIDENCE_DIR: ${{ runner.temp }}/silence-audition-qa
          OPENFILM_QA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Preserve synthetic Silence audition PCM and MP4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-silence-audition-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/silence-audition-qa/silence-audition-*
          if-no-files-found: error
          retention-days: 7
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-graphic-scene-${{ github.sha }}
          path: ${{ runner.temp }}/graphic-scene-qa/
          if-no-files-found: error
      - name: Validate interchange and prepare portable Resolve QA
        run: pnpm test:interchange --output "${{ runner.temp }}/resolve-qa-reference"
        env:
          OPENFILM_QA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: resolve-qa-reference-${{ github.sha }}
          path: ${{ runner.temp }}/resolve-qa-reference/
          if-no-files-found: error
      - run: node scripts/smoke-built-cli.mjs
  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      OPENFILM_QA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify declared source head
        run: node scripts/ci/check-source-head.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native media tools and independent timeline parser
        timeout-minutes: 8
        run: bash scripts/ci/install-media-tools.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # Deterministic per-test lists interleave expensive specs across isolated runners; each VM still uses one worker.
      - run: pnpm test:browser-shard-list ${{ matrix.shard }} "${{ runner.temp }}/e2e-test-list-${{ matrix.shard }}.txt"
      - run: pnpm test:e2e --test-list="${{ runner.temp }}/e2e-test-list-${{ matrix.shard }}.txt" --shard=1/1 --reporter=list,github,json
        env:
          OPENFILM_QA_BROWSER_SHARD: ${{ matrix.shard }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/e2e-result-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-result-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7
  docs-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify declared source head
        run: node scripts/ci/check-source-head.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs
  # Preserve the historical required-check identity; every lane and case is mandatory.
  typescript-and-media:
    needs: [fast-contract-check, heavy-media-qa, browser-e2e, docs-site]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify declared source head
        run: node scripts/ci/check-source-head.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: node scripts/ci/check-required-lanes.mjs
        env:
          FAST_RESULT: ${{ needs.fast-contract-check.result }}
          MEDIA_RESULT: ${{ needs.heavy-media-qa.result }}
          BROWSER_RESULT: ${{ needs.browser-e2e.result }}
          DOCS_RESULT: ${{ needs.docs-site.result }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-report-*
          path: ${{ runner.temp }}/browser-reports
          merge-multiple: true
      - run: pnpm test:browser-results "${{ runner.temp }}/browser-reports"
        env:
          OPENFILM_QA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  native-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify declared source head
        run: node scripts/ci/check-source-head.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: pnpm install --frozen-lockfile
      - name: Validate native artifact archive transport
        run: |
          python scripts/native/test-extract-runtime.py
          python scripts/native/test-archive-candidate.py
          python scripts/native/test-replay-security-artifact.py
      - run: pnpm build
      - run: pnpm test:native
      - run: cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
