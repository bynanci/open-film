name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast-contract-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test:i18n
      - run: pnpm test:docs-i18n
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:ci-partition
      - run: pnpm test:browser-partition
      - run: pnpm test:contracts
  heavy-media-qa:
    runs-on: ubuntu-24.04
    # Actual-media tests keep their existing budgets; browsers use isolated VMs below.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native media tools and independent timeline parser
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libimage-exiftool-perl fonts-noto-cjk
          python -m pip install opentimelineio==0.18.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ci-partition
      - run: pnpm test:media
        env:
          OPENFILM_GRAPHIC_QA_OUTPUT: ${{ runner.temp }}/graphic-scene-qa
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-graphic-scene-${{ github.sha }}
          path: ${{ runner.temp }}/graphic-scene-qa/
          if-no-files-found: error
      - name: Validate interchange and prepare portable Resolve QA
        run: pnpm test:interchange --output "${{ runner.temp }}/resolve-qa-reference"
        env:
          OPENFILM_QA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: resolve-qa-reference-${{ github.sha }}
          path: ${{ runner.temp }}/resolve-qa-reference/
          if-no-files-found: error
      - run: node scripts/smoke-built-cli.mjs
  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      OPENFILM_QA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/e2e-result-${{ matrix.shard }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native media tools and independent timeline parser
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libimage-exiftool-perl fonts-noto-cjk
          python -m pip install opentimelineio==0.18.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # Each VM owns its fixed ports and project; retain one worker and serial files.
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/4 --reporter=list,github,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-result-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7
  docs-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs
  # Preserve the historical required-check identity; every lane and case is mandatory.
  typescript-and-media:
    needs: [fast-contract-check, heavy-media-qa, browser-e2e, docs-site]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: node scripts/ci/check-required-lanes.mjs
        env:
          FAST_RESULT: ${{ needs.fast-contract-check.result }}
          MEDIA_RESULT: ${{ needs.heavy-media-qa.result }}
          BROWSER_RESULT: ${{ needs.browser-e2e.result }}
          DOCS_RESULT: ${{ needs.docs-site.result }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-report-*
          path: ${{ runner.temp }}/browser-reports
          merge-multiple: true
      - run: pnpm test:browser-results "${{ runner.temp }}/browser-reports"
        env:
          OPENFILM_QA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  native-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: pnpm install --frozen-lockfile
      - name: Validate native artifact archive transport
        run: |
          python scripts/native/test-extract-runtime.py
          python scripts/native/test-archive-candidate.py
      - run: pnpm build
      - run: pnpm test:native
      - run: cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
