# SPDX-License-Identifier: Apache-2.0
name: Dependency security
on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"
  pull_request:
    paths:
      - "**/package.json"
      - "pnpm-lock.yaml"
      - "apps/desktop/src-tauri/**"
      - "rust-toolchain*"
      - ".cargo/**"
      - "vendor/**"
      - "third-party/**"
      - "scripts/security/**"
      - ".gitattributes"
      - ".github/workflows/native-security.yml"
      - ".github/workflows/native-installer.yml"
      - ".github/workflows/security.yml"
permissions:
  contents: read
jobs:
  javascript-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: pnpm install --frozen-lockfile
      - name: Check known dependency vulnerabilities
        run: pnpm audit --json > npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: javascript-advisories
          path: npm-audit.json
          if-no-files-found: error
  native-source-admission:
    uses: ./.github/workflows/native-security.yml
    with:
      candidate_sha: ${{ github.event.pull_request.head.sha || github.sha }}
