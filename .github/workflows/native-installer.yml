name: Native installer candidate
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [ubuntu-24.04, windows-2022, macos-14]
        required: true
      runtime_run_id:
        description: Source workflow run containing the reviewed runtime artifact
        required: true
      runtime_artifact_id:
        description: Reviewed runtime artifact from this repository, staged on the target OS/architecture
        required: true
      manifest_sha256:
        description: Independently reviewed runtime-manifest.json SHA-256
        required: true
permissions:
  contents: read
  actions: read
jobs:
  security-admission:
    uses: ./.github/workflows/native-security.yml
    with:
      candidate_sha: ${{ github.sha }}
  candidate:
    needs: security-admission
    runs-on: ${{ inputs.platform }}
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @openfilm/desktop tauri icon src-tauri/icons/icon.svg
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.runtime_run_id }}
          artifact-ids: ${{ inputs.runtime_artifact_id }}
          github-token: ${{ github.token }}
          path: runtime-input
          merge-multiple: true
      - name: Extract permission-preserving reviewed runtime
        shell: bash
        run: |
          python scripts/native/test-extract-runtime.py
          mkdir -p apps/desktop/src-tauri/resources/runtime
          python scripts/native/extract-runtime.py runtime-input/runtime.tar apps/desktop/src-tauri/resources/runtime
      - name: Verify reviewed runtime and owned start/close
        shell: bash
        env:
          EXPECTED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: pnpm exec tsx scripts/native/verify.ts apps/desktop/src-tauri/resources/runtime "$EXPECTED_MANIFEST_SHA256"
      - name: Resolve exact native target paths
        id: native-target
        shell: bash
        run: node scripts/native/capture-cargo-build.mjs target >> "$GITHUB_OUTPUT"
      - run: pnpm test:native
      - name: Build Windows current-user candidate
        if: runner.os == 'Windows'
        shell: bash
        env:
          NATIVE_TARGET: ${{ steps.native-target.outputs.triple }}
        run: pnpm --filter @openfilm/desktop tauri build --config src-tauri/tauri.bundle.conf.json --bundles nsis --target "$NATIVE_TARGET" -- --locked --message-format=json
      - name: Build macOS candidate
        if: runner.os == 'macOS'
        shell: bash
        env:
          NATIVE_TARGET: ${{ steps.native-target.outputs.triple }}
        run: pnpm --filter @openfilm/desktop tauri build --config src-tauri/tauri.bundle.conf.json --bundles app,dmg --target "$NATIVE_TARGET" -- --locked --message-format=json
      - name: Build Linux candidate
        if: runner.os == 'Linux'
        shell: bash
        env:
          NATIVE_TARGET: ${{ steps.native-target.outputs.triple }}
        run: pnpm --filter @openfilm/desktop tauri build --config src-tauri/tauri.bundle.conf.json --bundles deb,appimage --target "$NATIVE_TARGET" -- --locked --message-format=json
      - name: Retain raw Cargo build capture, including failed invocations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-cargo-build-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            dist/native-evidence/cargo-build/
            apps/desktop/src-tauri/Cargo.lock
          if-no-files-found: ignore
          retention-days: 30
      - name: Validate target-specific bundle and prepare receipt identity inputs
        env:
          NATIVE_TARGET: ${{ steps.native-target.outputs.triple }}
        run: node scripts/native/capture-cargo-build.mjs finalize
      - name: Stage target-specific shell without changing its bytes
        shell: bash
        env:
          NATIVE_TARGET: ${{ steps.native-target.outputs.triple }}
        run: pnpm exec tsx scripts/native/receipt.ts prepare-shell . "$NATIVE_TARGET"
      - name: Record incomplete pre-trust candidate identity
        shell: bash
        env:
          BUNDLE_DIRECTORY: ${{ steps.native-target.outputs.bundleDirectory }}
        run: pnpm exec tsx scripts/native/receipt.ts identity . dist/native-evidence/identity-inputs.json "$BUNDLE_DIRECTORY/candidate.json"
      - name: Snapshot current final bytes (trust and lifecycle remain incomplete)
        shell: bash
        env:
          BUNDLE_DIRECTORY: ${{ steps.native-target.outputs.bundleDirectory }}
        run: pnpm exec tsx scripts/native/receipt.ts seal . "$BUNDLE_DIRECTORY/candidate.json" "$BUNDLE_DIRECTORY/final-bytes.json"
      - name: Archive installer outputs with executable modes
        shell: bash
        env:
          BUNDLE_DIRECTORY: ${{ steps.native-target.outputs.bundleDirectory }}
        run: python scripts/native/archive-candidate.py "$BUNDLE_DIRECTORY" native-candidate/installers.tar
      - uses: actions/upload-artifact@v4
        with:
          name: native-candidate-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            native-candidate/installers.tar
            native-candidate/installers.tar.sha256
            ${{ steps.native-target.outputs.bundleDirectory }}/candidate.json
            ${{ steps.native-target.outputs.bundleDirectory }}/final-bytes.json
            dist/native-evidence/identity-inputs.json
            dist/build-contributions.json
            ${{ steps.native-target.outputs.shellPath }}
            apps/desktop/src-tauri/Cargo.lock
            apps/desktop/src-tauri/resources/runtime/runtime-manifest.json
            apps/desktop/src-tauri/resources/runtime/sbom.spdx.json
          if-no-files-found: error
          retention-days: 30
