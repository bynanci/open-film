name: Bug report
description: Report a reproducible problem with OpenFilm.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: >
        Do not include private media, project databases, source paths, GPS data,
        credentials or vulnerability details. Use generated fixtures where possible.
  - type: dropdown
    id: language
    attributes:
      label: Preferred language
      options:
        - English
        - 繁體中文
        - 日本語
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Release or commit
      description: Include the release tag or full commit SHA.
      placeholder: v0.4.0 or a full commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Environment
      options:
        - Windows
        - macOS
        - Linux
        - Browser development workflow
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest reproducible sequence and sanitized command output.
      placeholder: 1. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Remove usernames, absolute paths, GPS, private media and credentials from logs or screenshots.
    validations:
      required: false
