[package]
name = "openfilm-desktop"
version = "0.4.0"
description = "OpenFilm local media storytelling workspace"
authors = ["OpenFilm contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "openfilm_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "=0.10.9"

[dependencies]
sha2 = "=0.10.9"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
